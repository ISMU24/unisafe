# UniSafe - local production-shaped stack
#
#   docker compose up --build
#
# Dashboard  http://localhost:5173   (nginx, proxies /api and /socket.io)
# API        http://localhost:3001
#
# Secrets come from a .env file next to this one. Copy server/.env.production.example
# to .env and fill it in, or export the variables in your shell. The server refuses
# to start without two distinct JWT secrets of at least 32 characters.

services:
  postgres:
    image: postgres:16-alpine
    container_name: unisafe-postgres
    environment:
      POSTGRES_DB: unisafe
      POSTGRES_USER: unisafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unisafe_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unisafe -d unisafe"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    # The server image needs both server/ and assets/, so the build context is
    # the UniSafe directory rather than UniSafe/server.
    build:
      context: ./UniSafe
      dockerfile: server/Dockerfile
    container_name: unisafe-server
    environment:
      DATABASE_URL: postgresql://unisafe:${POSTGRES_PASSWORD:-unisafe_dev}@postgres:5432/unisafe?sslmode=disable
      DB_SSL: "false"
      NODE_ENV: production
      PORT: "3001"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      # The dashboard calls through nginx on the same origin, so the browser
      # sends Origin: http://localhost:5173.
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:5173}
      # Optional: leave empty to run without AI policy Q&A.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./uniforce-dashboard
      dockerfile: Dockerfile
    container_name: unisafe-dashboard
    # VITE_API_URL is intentionally unset so the built app calls its own origin
    # and nginx proxies to the "server" service.
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data: