# UniSafe — Render Blueprint
#
# Deploys two services from one repo:
#   unisafe-api       — Express API  (UniSafe/server)
#   unisafe-dashboard — React SPA    (uniforce-dashboard)
#
# Deploy: Render dashboard → New → Blueprint → select ISMU24/unisafe
#
# Set VITE_API_URL to the API's public HTTPS origin and CLIENT_ORIGINS to
# the dashboard's public HTTPS origin in Render. Public URLs are not a
# supported fromService property. See DEPLOY-WINDOWS.md for the sequence.
# JWT secrets are generated automatically; optional AI keys are supplied by you.

services:
  - type: web
    name: unisafe-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: UniSafe/server
    buildCommand: npm install
    # Optional on paid plans; schema also initializes on the first runtime query.
    # preDeployCommand: npm run db:init
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: unisafe-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: "900"
      - key: JWT_REFRESH_EXPIRY
        value: "604800"
      - key: CLIENT_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

  - type: web
    name: unisafe-dashboard
    runtime: static
    rootDir: uniforce-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false

databases:
  - name: unisafe-db
    databaseName: unisafe
    user: unisafe
    plan: free
    region: oregon
