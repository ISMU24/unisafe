# UniSafe — Render Blueprint
#
# Deploys two services from one repo:
#   unisafe-api       — Express API  (UniSafe/server)
#   unisafe-dashboard — React SPA    (uniforce-dashboard)
#
# Deploy: Render dashboard → New → Blueprint → select ISMU24/unisafe
#
# Render wires VITE_API_URL → the API's public URL and
# CLIENT_ORIGINS → the dashboard's public URL automatically
# via the `fromService` references below, so you never have to
# copy-paste URLs between services.
#
# The only values you must set manually in the Render dashboard after
# the first deploy are the JWT secrets if you want to override the
# auto-generated ones.

services:
  - type: web
    name: unisafe-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: UniSafe/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: unisafe-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: "900"
      - key: JWT_REFRESH_EXPIRY
        value: "604800"
      - key: CLIENT_ORIGINS
        fromService:
          name: unisafe-dashboard
          type: web
          property: onrender-url
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

  - type: web
    name: unisafe-dashboard
    runtime: static
    plan: starter
    region: oregon
    rootDir: uniforce-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          name: unisafe-api
          type: web
          property: onrender-url

databases:
  - name: unisafe-db
    databaseName: unisafe
    user: unisafe
    plan: free
    region: oregon
